<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Love 💕</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height:100vh;
            font-family:'Segoe UI',sans-serif;
            color:white; padding:20px;
        }
        .box {
            max-width:500px; margin:0 auto;
            background:rgba(255,255,255,0.05);
            border-radius:20px; padding:30px;
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
        }
        h1 { text-align:center; font-size:28px; margin-bottom:25px;
             background:linear-gradient(90deg,#ff6b6b,#ffa07a,#ff69b4);
             -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        label { display:block; margin:15px 0 5px; font-size:14px; color:#aaa; }
        input, textarea {
            width:100%; padding:12px 15px; border:none; border-radius:10px;
            background:rgba(255,255,255,0.1); color:white; font-size:16px;
            outline:none; transition:all 0.3s;
        }
        input:focus, textarea:focus { background:rgba(255,255,255,0.15); box-shadow:0 0 15px rgba(255,107,107,0.3); }
        textarea { min-height:80px; resize:vertical; }
        button {
            width:100%; padding:15px; margin-top:25px;
            border:none; border-radius:50px;
            background:linear-gradient(90deg,#ff6b6b,#ff69b4);
            color:white; font-size:18px; font-weight:bold;
            cursor:pointer; transition:all 0.3s;
            box-shadow:0 5px 30px rgba(255,107,107,0.4);
        }
        button:hover { transform:scale(1.02); box-shadow:0 5px 50px rgba(255,107,107,0.7); }
        .preview {
            margin-top:30px; text-align:center; display:none;
            animation:appear 0.5s ease-in forwards;
        }
        @keyframes appear { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .heart-big { font-size:80px; animation:beat 1s infinite; }
        @keyframes beat { 0%,100%{transform:scale(1)} 20%{transform:scale(1.2)} }
        .names { font-size:36px; margin:15px 0; font-weight:bold;
                background:linear-gradient(90deg,#FFD700,#FFF8DC,#FFD700);
                background-size:200% auto;
                -webkit-background-clip:text; -webkit-text-fill-color:transparent;
                animation:shine 3s linear infinite; }
        @keyframes shine { to { background-position:200% center; } }
        .love-msg { font-size:18px; color:#e0e0e0; font-style:italic; margin-top:10px; }
        .petal { position:fixed; top:-20px; width:12px; height:12px;
                background:radial-gradient(ellipse,#FFD700,#FFA500);
                border-radius:80% 20% 80% 20%;
                animation:fall linear infinite; z-index:0; opacity:0.7; pointer-events:none;}
        @keyframes fall { 0%{transform:translateY(-20px) rotate(0)} 100%{transform:translateY(105vh) rotate(360deg);opacity:0} }
    </style>
</head>
<body>
    <!-- Màn hình tạo -->
    <div class="box" id="form">
        <h1>💕 Tạo QR Love 💕</h1>
        <label>💛 Tên bạn</label>
        <input id="name1" placeholder="VD: Khánh">
        <label>💖 Tên người ấy</label>
        <input id="name2" placeholder="VD: Thư">
        <label>💌 Lời nhắn</label>
        <textarea id="msg" placeholder="Yêu em nhiều hơn hôm qua...">Yêu em nhiều hơn hôm qua, ít hơn ngày mai</textarea>
        <button onclick="generate()">✨ TẠO NGAY ✨</button>
    </div>

    <!-- Màn hình kết quả -->
    <div class="preview" id="result">
        <div class="heart-big">❤️</div>
        <div class="names" id="displayName"></div>
        <p class="love-msg" id="displayMsg"></p>
    </div>

    <!-- Hoa rơi -->
    <script>
        setInterval(()=>{
            const p=document.createElement('div'); p.className='petal';
            p.style.left=Math.random()*100+'vw';
            p.style.animationDuration=(4+Math.random()*5)+'s';
            document.body.appendChild(p);
            setTimeout(()=>p.remove(),9000);
        },300);
        function generate(){
            const n1=document.getElementById('name1').value||'Anh';
            const n2=document.getElementById('name2').value||'Em';
            const msg=document.getElementById('msg').value||'Yêu bạn 💕';
            document.getElementById('form').style.display='none';
            const res=document.getElementById('result');
            res.style.display='block';
            document.getElementById('displayName').textContent=n1+' ❤️ '+n2;
            document.getElementById('displayMsg').textContent='"'+msg+'"';
        }
    </script>
</body>
</html>
