<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khánh ❤️ Thư</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000;
            min-height:100vh;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            font-family:'Segoe UI',sans-serif;
            overflow:hidden; color:white;
        }
        canvas#fw { position:fixed; top:0; left:0; z-index:1; pointer-events:none; }
        .content { z-index:2; text-align:center; position:relative; }

        /* Gõ chữ */
        .typing {
            font-size:42px; font-weight:bold;
            min-height:60px;
            background:linear-gradient(90deg,#ff6b6b,#ffa07a,#ff69b4,#FFD700);
            background-size:300% auto;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation:rainbow 4s linear infinite;
        }
        @keyframes rainbow { to { background-position:300% center; } }
        .cursor { display:inline-block; width:3px; height:45px; background:#ff69b4; animation:blink 0.8s infinite; vertical-align:middle; }
        @keyframes blink { 50% { opacity:0; } }

        /* Tim đập lớn */
        .heart-big {
            font-size:180px; margin-bottom:20px;
            animation:heartbeat 1s infinite;
            filter:drop-shadow(0 0 80px rgba(255,50,50,0.8));
        }
        @keyframes heartbeat {
            0%,100% { transform:scale(1); }
            20% { transform:scale(1.25); }
            40% { transform:scale(1); }
            60% { transform:scale(1.15); }
        }

        /* Dòng chữ phụ */
        .sub { margin-top:25px; font-size:20px; color:rgba(255,255,255,0.8); opacity:0; animation:fadein 2s ease-in 2s forwards; }
        @keyframes fadein { to { opacity:1; } }

        /* Đếm ngày */
        .days-box {
            margin-top:25px; padding:12px 30px;
            border:2px solid rgba(255,107,107,0.5);
            border-radius:50px;
            background:rgba(255,107,107,0.1);
            backdrop-filter:blur(10px);
            opacity:0; animation:fadein 2s ease-in 3.5s forwards;
        }
        .days-box span { font-size:32px; font-weight:bold; color:#ff6b6b; }

        /* Nút bấm */
        .btn-love {
            margin-top:25px; padding:15px 40px;
            border:none; border-radius:50px;
            background:linear-gradient(90deg,#ff6b6b,#ff69b4);
            color:white; font-size:18px; cursor:pointer;
            transition:all 0.3s; opacity:0;
            animation:fadein 2s ease-in 5s forwards;
            box-shadow:0 5px 30px rgba(255,107,107,0.5);
        }
        .btn-love:hover { transform:scale(1.1); box-shadow:0 5px 50px rgba(255,107,107,0.8); }
    </style>
</head>
<body>
    <canvas id="fw"></canvas>
    <div class="content">
        <div class="heart-big">❤️</div><br>
        <div class="typing"><span class="cursor">|</span></div>
        <p class="sub">💕 Từ ngày gặp em, đời anh đẹp hơn 💕</p>
        <div class="days-box">Yêu em <span id="d">0</span> ngày 🌹</div>
        <button class="btn-love" onclick="fireworks()">🎁 BẤM VÀO ĐÂY</button>
    </div>
    <audio autoplay loop src="https://cdn.pixabay.com/audio/2022/02/22/audio_716756db81.mp3"></audio>
<script>
// === GÕ CHỮ TỪNG KÝ TỰ ===
const text = "Khánh ❤️ Thư";
const el = document.querySelector('.typing');
const cursor = document.querySelector('.cursor');
let i = 0;
function type() {
    if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text[i]);
        i++;
        setTimeout(type, 120);
    }
}
setTimeout(type, 800);

// === PHÁO HOA ===
const cv = document.getElementById('fw');
const ctx = cv.getContext('2d');
cv.width = innerWidth; cv.height = innerHeight;
let parts = [];
function explode(x, y) {
    const colors = ['#ff6b6b','#ffa07a','#ff69b4','#FFD700','#00ff88','#87ceeb'];
    for(let j=0;j<60;j++){
        const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
        parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:colors[Math.floor(Math.random()*colors.length)]});
    }
}
function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='lighter';
    for(let k=parts.length-1;k>=0;k--){
        const p=parts[k];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.98;p.vy*=0.98;p.life-=0.015;
        if(p.life<=0){parts.splice(k,1);continue;}
        ctx.beginPath();ctx.arc(p.x,p.y,2*p.life,0,Math.PI*2);
        ctx.fillStyle=p.color;ctx.globalAlpha=p.life;ctx.fill();
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
}
loop();
function fireworks(){ for(let k=0;k<5;k++) setTimeout(()=>explode(Math.random()*innerWidth,Math.random()*innerHeight*0.5),k*300); }
setInterval(()=>{ if(Math.random()>0.7) explode(Math.random()*innerWidth,Math.random()*innerHeight*0.4); },2000);

// === ĐẾM NGÀY YÊU ===
const start = new Date('2025-01-01');
function upd(){ document.getElementById('d').textContent = Math.floor((new Date()-start)/(86400000)); }
upd();
</script>
</body>
</html>
